<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | NextTech Labs</title>

    <link rel="icon" href="favicon.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.08);
        }

        /* NextTech Labs Logo */
        .logo {
            display: block;
            width: 180px;
            height: auto;
            max-width: 100%;
            object-fit: contain;
            margin: 0 auto 22px;
        }

        h1 {
            text-align: center;
            font-size: 28px;
            color: #111827;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            background: #ffffff;
            color: #111827;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
        }

        button {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 10px;
            background: #2563eb;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .error {
            display: none;
            margin-bottom: 18px;
            padding: 12px;
            border-radius: 8px;
            background: #fee2e2;
            color: #b91c1c;
            font-size: 14px;
            line-height: 1.4;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #9ca3af;
            font-size: 13px;
        }

        @media (max-width: 480px) {

            body {
                padding: 15px;
            }

            .login-box {
                padding: 30px 22px;
            }

            .logo {
                width: 160px;
                margin-bottom: 20px;
            }

            h1 {
                font-size: 25px;
            }

            .subtitle {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <div class="login-box">

        <!-- NextTech Labs Logo -->
        <img
            src="./images/logo.png"
            alt="NextTech Labs"
            class="logo"
        >

        <h1>Admin Login</h1>

        <p class="subtitle">
            NextTech Labs Management Panel
        </p>

        <div id="loginError" class="error"></div>

        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="admin@nexttechlabs.com"
                    autocomplete="username"
                    required
                >

            </div>

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>

            <button
                type="submit"
                id="loginBtn"
            >
                Login to Dashboard
            </button>

        </form>

        <div class="footer">
            © 2026 NextTech Labs
        </div>

    </div>


    <script>

        const loginForm = document.getElementById("loginForm");
        const loginBtn = document.getElementById("loginBtn");
        const loginError = document.getElementById("loginError");


        loginForm.addEventListener("submit", async function (e) {

            e.preventDefault();

            loginError.style.display = "none";
            loginError.textContent = "";

            loginBtn.disabled = true;
            loginBtn.textContent = "Signing in...";


            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;


            try {

                const response = await fetch(
                    "https://nexttech-backend-euka.onrender.com/api/admin/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    }
                );


                const data = await response.json();


                if (!response.ok || !data.success) {

                    throw new Error(
                        data.message || "Login failed."
                    );

                }


                /* Save JWT Token */

                localStorage.setItem(
                    "nexttech_admin_token",
                    data.token
                );


                /* Save Admin Information */

                localStorage.setItem(
                    "nexttech_admin",
                    JSON.stringify(data.admin)
                );


                /* Open Dashboard */

                window.location.href =
                    "admin-dashboard.html";


            } catch (error) {

                console.error(
                    "Admin Login Error:",
                    error
                );


                loginError.textContent =
                    error.message ||
                    "Unable to login.";


                loginError.style.display =
                    "block";


            } finally {

                loginBtn.disabled = false;

                loginBtn.textContent =
                    "Login to Dashboard";

            }

        });

    </script>

</body>
</html>
