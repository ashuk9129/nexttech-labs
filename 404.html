<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>404 - Page Not Found | NextTech Labs</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="responsive.css">

<style>
.error-page{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:30px;
}

.error-box h1{
font-size:8rem;
margin-bottom:15px;
background:linear-gradient(90deg,#20c5ff,#8b5cf6);
	background-clip:text; /* standard property for compatibility */
	-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
	-webkit-text-fill-color:transparent;
}

.error-box h2{
font-size:2rem;
margin-bottom:20px;
}

.error-box p{
max-width:600px;
margin:auto;
margin-bottom:35px;
color:#94a3b8;
line-height:1.8;
}

.home-btn{
display:inline-block;
padding:14px 30px;
border-radius:12px;
background:linear-gradient(135deg,#20c5ff,#8b5cf6);
color:#fff;
text-decoration:none;
font-weight:600;
transition:.3s;
}

.home-btn:hover{
transform:translateY(-3px);
}
</style>

</head>

<body>

<section class="error-page">

<div class="error-box">

<img src="images/logo.png" width="120" alt="NextTech Labs Logo">

<h1>404</h1>

<h2>Page Not Found</h2>

<p>
The page you're looking for doesn't exist or may have been moved.
Let's get you back to the homepage.
</p>

<a href="index.html" class="home-btn">
Go Back Home
</a>

</div>

</section>

</body>
</html>
